<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-ops-filter-root]').forEach(function(root){
      const search = root.querySelector('[data-ops-search]');
      const status = root.querySelector('[data-ops-status]');
      const clear = root.querySelector('[data-ops-clear]');
      const rows = Array.from(root.querySelectorAll('[data-ops-row]'));
      function apply(){
        const q = search ? String(search.value || '').toLowerCase().trim() : '';
        const s = status ? String(status.value || '').toLowerCase().trim() : '';
        rows.forEach(function(row){
          const text = String(row.getAttribute('data-search') || '').toLowerCase();
          const rowStatus = String(row.getAttribute('data-status') || '').toLowerCase();
          row.style.display = (!q || text.indexOf(q) !== -1) && (!s || rowStatus === s) ? '' : 'none';
        });
      }
      if(search){ search.addEventListener('input', apply); }
      if(status){ status.addEventListener('change', apply); }
      if(clear){ clear.addEventListener('click', function(){ if(search) search.value=''; if(status) status.value=''; apply(); }); }
      apply();
    });

    document.querySelectorAll('[data-ops-preview-src]').forEach(function(img){
      img.addEventListener('click', function(){
        let modal = document.getElementById('OpsPreviewModal');
        if(!modal){ return; }
        let preview = modal.querySelector('img');
        preview.src = img.getAttribute('data-ops-preview-src') || img.src;
        modal.classList.add('is_open');
      });
    });
    document.querySelectorAll('[data-ops-preview-close]').forEach(function(button){
      button.addEventListener('click', function(){
        const modal = document.getElementById('OpsPreviewModal');
        if(modal){ modal.classList.remove('is_open'); }
      });
    });
  });
</script>
