<div class="nj-workflow finance-locked-workflow{% if detail %} is-detail{% endif %}{% if compact %} is-compact{% endif %}" aria-label="Contract status: {{ contract.get_status_display }}">
  <span class="finance-workflow-lock"><i class="bi bi-lock" aria-hidden="true"></i> Workflow controlled</span>
  <div class="nj-status-track finance-status-track">
    <span class="nj-status-node is-neutral{% if contract.status == 'draft' or contract.status == 'pending' %} is-current{% endif %}" style="--stage-color:#64748b" title="Draft" aria-label="Draft"><i class="bi bi-file-earmark" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-blue{% if contract.status == 'generated' %} is-current{% endif %}" style="--stage-color:#0868e8" title="Generated" aria-label="Generated"><i class="bi bi-file-earmark-check" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-warning{% if contract.status == 'sent' or contract.status == 'viewed' %} is-current{% endif %}" style="--stage-color:#f59e0b" title="Sent / viewed" aria-label="Sent or viewed"><i class="bi bi-send-check" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-success{% if contract.status == 'approved' %} is-current{% endif %}" style="--stage-color:#0e9f6e" title="Approved" aria-label="Approved"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-success{% if contract.status == 'signed' or contract.status == 'active' or contract.status == 'completed' %} is-current{% endif %}" style="--stage-color:#0e9f6e" title="Signed" aria-label="Signed"><i class="bi bi-pen" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-danger{% if contract.status == 'rejected' %} is-current{% endif %}" style="--stage-color:#ef3340" title="Rejected" aria-label="Rejected"><i class="bi bi-x-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-void{% if contract.status == 'void' or contract.status == 'cancelled' %} is-current{% endif %}" style="--stage-color:#6b7280" title="Void" aria-label="Void"><i class="bi bi-slash-circle" aria-hidden="true"></i></span>
  </div>
  <span class="nj-status-caption {% if contract.status == 'draft' or contract.status == 'pending' %}is-neutral{% elif contract.status == 'generated' %}is-blue{% elif contract.status == 'sent' or contract.status == 'viewed' %}is-warning{% elif contract.status == 'approved' or contract.status == 'signed' or contract.status == 'active' or contract.status == 'completed' %}is-success{% elif contract.status == 'rejected' %}is-danger{% else %}is-void{% endif %}">{{ contract.get_status_display }}</span>
</div>
