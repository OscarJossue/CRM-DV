<div class="supplier-status-workflow{% if detail %} is-detail{% endif %}" aria-label="Payment status: {{ current_label }}">
  <div class="supplier-status-track">
    <span class="supplier-status-node{% if current_status == 'unpaid' %} is-current{% endif %}" style="--stage-color:#ef3340" data-tooltip="Unpaid" aria-label="Unpaid"><i class="bi bi-wallet2" aria-hidden="true"></i></span>
    <span class="supplier-status-line" aria-hidden="true"></span>
    <span class="supplier-status-node{% if current_status == 'partial' %} is-current{% endif %}" style="--stage-color:#f59e0b" data-tooltip="Partially paid" aria-label="Partially paid"><i class="bi bi-circle-half" aria-hidden="true"></i></span>
    <span class="supplier-status-line" aria-hidden="true"></span>
    <span class="supplier-status-node{% if current_status == 'paid' %} is-current{% endif %}" style="--stage-color:#0e9f6e" data-tooltip="Paid" aria-label="Paid"><i class="bi bi-cash-coin" aria-hidden="true"></i></span>
  </div>
  <span class="supplier-status-caption is-{{ current_status }}">{{ current_label }}</span>
</div>
