<div class="supplier-status-workflow{% if detail %} is-detail{% endif %}" aria-label="Supplier status: {{ current_label }}">
  <div class="supplier-status-track">
    <span class="supplier-status-node{% if current_status == 'active' %} is-current{% endif %}" style="--stage-color:#0e9f6e" data-tooltip="Active" aria-label="Active"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
    <span class="supplier-status-line" aria-hidden="true"></span>
    <span class="supplier-status-node{% if current_status == 'inactive' %} is-current{% endif %}" style="--stage-color:#64748b" data-tooltip="Inactive" aria-label="Inactive"><i class="bi bi-pause-circle" aria-hidden="true"></i></span>
    <span class="supplier-status-line" aria-hidden="true"></span>
    <span class="supplier-status-node{% if current_status == 'blocked' %} is-current{% endif %}" style="--stage-color:#ef3340" data-tooltip="Blocked" aria-label="Blocked"><i class="bi bi-slash-circle" aria-hidden="true"></i></span>
  </div>
  <span class="supplier-status-caption is-{{ current_status }}">{{ current_label }}</span>
</div>
