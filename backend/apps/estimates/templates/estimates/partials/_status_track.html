<div class="nj-workflow finance-locked-workflow{% if detail %} is-detail{% endif %}{% if compact %} is-compact{% endif %}" aria-label="Estimate status: {{ estimate.get_status_display }}">
  <span class="finance-workflow-lock"><i class="bi bi-lock" aria-hidden="true"></i> Workflow controlled</span>
  <div class="nj-status-track finance-status-track">
    <span class="nj-status-node is-neutral{% if estimate.status == 'draft' %} is-current{% endif %}" style="--stage-color:#64748b" title="Draft" aria-label="Draft"><i class="bi bi-file-earmark" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-warning{% if estimate.status == 'pending' or estimate.status == 'pending_send' %} is-current{% endif %}" style="--stage-color:#f59e0b" title="Pending send" aria-label="Pending send"><i class="bi bi-clock-history" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-blue{% if estimate.status == 'sent' or estimate.status == 'viewed' %} is-current{% endif %}" style="--stage-color:#0868e8" title="Sent / viewed" aria-label="Sent or viewed"><i class="bi bi-send-check" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-success{% if estimate.status == 'approved' %} is-current{% endif %}" style="--stage-color:#0e9f6e" title="Approved" aria-label="Approved"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-danger{% if estimate.status == 'rejected' or estimate.status == 'expired' %} is-current{% endif %}" style="--stage-color:#ef3340" title="Rejected / expired" aria-label="Rejected or expired"><i class="bi bi-x-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-violet{% if estimate.status == 'converted' %} is-current{% endif %}" style="--stage-color:#7c3aed" title="Converted" aria-label="Converted"><i class="bi bi-folder-check" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-void{% if estimate.status == 'cancelled' %} is-current{% endif %}" style="--stage-color:#6b7280" title="Void" aria-label="Void"><i class="bi bi-slash-circle" aria-hidden="true"></i></span>
  </div>
  <span class="nj-status-caption {% if estimate.status == 'draft' %}is-neutral{% elif estimate.status == 'pending' or estimate.status == 'pending_send' %}is-warning{% elif estimate.status == 'sent' or estimate.status == 'viewed' %}is-blue{% elif estimate.status == 'approved' %}is-success{% elif estimate.status == 'converted' %}is-violet{% elif estimate.status == 'cancelled' %}is-void{% else %}is-danger{% endif %}">{% if estimate.status == 'pending' %}Pending Send{% elif estimate.status == 'cancelled' %}Void{% else %}{{ estimate.get_status_display }}{% endif %}</span>
</div>
