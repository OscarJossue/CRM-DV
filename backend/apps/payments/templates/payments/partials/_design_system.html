<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  .payment_theme {
    --payment-ink: #212227;
    --payment-muted: #637074;
    --payment-line: #d6dde8;
    --payment-line-strong: #c8d2e0;
    --payment-panel-soft: #f7f9fc;
    --payment-accent-soft: #AAB9CF;
    --payment-accent-pale: #BDD4E7;
    --payment-blue: #48658f;
    --payment-blue-dark: #344a69;
    --payment-danger: #c53d3d;
    --payment-danger-soft: #fde9e8;
    --payment-success: #3f6b5e;
    --payment-success-soft: #e8f3ee;
    --payment-warning: #ab7224;
    --payment-warning-soft: #fff3e2;
    --payment-shadow-soft: 0 12px 26px rgba(33, 34, 39, 0.06);
    font-family: 'Inter', Arial, sans-serif;
    color: var(--payment-ink);
  }

  .payment_theme, .payment_theme * { font-family: 'Inter', Arial, sans-serif; }
  .payment_theme h1, .payment_theme h2, .payment_theme h3, .payment_theme h4,
  .payment_theme .crm_section_title, .payment_theme .payment_toolbar_title h2,
  .payment_theme .payment_detail_title, .payment_theme .statement_client_name,
  .payment_theme .finance_summary_title { font-family: 'Poppins', 'Inter', Arial, sans-serif; letter-spacing: -0.03em; }

  .payment_theme .crm_card,
  .payment_theme.crm_card,
  .payment_theme .payment_detail_hero,
  .payment_theme .payment_void_confirm_card,
  .payment_theme .payment_filter_card,
  .payment_theme .payment_donut_card {
    border: 1px solid var(--payment-line) !important;
    border-radius: 24px !important;
    background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%) !important;
    box-shadow: var(--payment-shadow-soft) !important;
  }

  .payment_theme .crm_button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px !important;
    border: 1px solid var(--payment-blue) !important;
    background: linear-gradient(180deg, var(--payment-blue) 0%, var(--payment-blue-dark) 100%) !important;
    color: #ffffff !important; font-weight: 800 !important;
    box-shadow: 0 12px 24px rgba(72, 101, 143, 0.16);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .payment_theme .crm_button:hover { transform: translateY(-1px); box-shadow: 0 16px 28px rgba(72,101,143,.22); }
  .payment_theme .crm_button_secondary { background: #ffffff !important; color: var(--payment-blue) !important; border-color: var(--payment-line-strong) !important; box-shadow: none !important; }

  .payment_theme input, .payment_theme select, .payment_theme textarea,
  .payment_theme .crm_input, .payment_theme .payment_filter_input, .payment_theme .payment_filter_select {
    min-height: 44px;
    border: 1px solid var(--payment-line-strong) !important;
    border-radius: 14px !important;
    background-color: #ffffff !important;
    color: var(--payment-ink) !important;
    box-shadow: none !important;
  }
  .payment_theme input:focus, .payment_theme select:focus, .payment_theme textarea:focus,
  .payment_theme .crm_input:focus, .payment_theme .payment_filter_input:focus, .payment_theme .payment_filter_select:focus {
    outline: 0; border-color: var(--payment-blue) !important; box-shadow: 0 0 0 4px rgba(72,101,143,.12) !important;
  }
  .payment_theme select, .payment_theme .payment_filter_select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--payment-blue) 50%), linear-gradient(135deg, var(--payment-blue) 50%, transparent 50%), linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
    background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px), 0 0;
    background-size: 6px 6px, 6px 6px, 100% 100%; background-repeat: no-repeat;
    padding-right: 42px !important; font-weight: 800;
  }

  .payment_theme .payment_page { gap: 18px !important; }
  .payment_theme .payment_toolbar { align-items: flex-end !important; gap: 18px !important; flex-wrap: wrap; }
  .payment_theme .payment_toolbar_title h2 { color: var(--payment-ink) !important; font-size: clamp(28px, 2.5vw, 36px) !important; font-weight: 800 !important; }
  .payment_theme .payment_toolbar_title p, .payment_theme .payment_muted, .payment_theme .crm_page_text { color: var(--payment-muted) !important; font-weight: 600 !important; }

  .payment_theme .payment_balance_summary_card,
  .payment_theme .finance_summary_card,
  .payment_theme .statement_summary_card {
    --summary-color: var(--nj-blue, #0868e8);
    --summary-soft: #eef6ff;
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
    min-height: 112px;
    padding: 16px !important;
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--summary-color) 22%, var(--payment-line)) !important;
    border-radius: 18px !important;
    background: linear-gradient(145deg, #ffffff 0%, color-mix(in srgb, var(--summary-soft) 72%, #ffffff) 100%) !important;
    color: var(--payment-ink) !important;
    box-shadow: 0 12px 28px color-mix(in srgb, var(--summary-color) 11%, transparent) !important;
    transform: none !important;
  }

  .payment_theme .payment_balance_summary_card::before,
  .payment_theme .finance_summary_card::before,
  .payment_theme .statement_summary_card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--summary-color);
  }

  .payment_theme .payment_balance_summary_card::after,
  .payment_theme .finance_summary_card::after,
  .payment_theme .statement_summary_card::after {
    content: "";
    position: absolute;
    right: -28px;
    bottom: -42px;
    width: 112px;
    height: 112px;
    border-radius: 999px;
    background: var(--summary-color);
    opacity: .065;
    pointer-events: none;
  }

  .payment_theme .payment_balance_summary_card.is-blue,
  .payment_theme .finance_summary_card.is-blue,
  .payment_theme .statement_summary_card.is-blue { --summary-color: #0868e8; --summary-soft: #eef6ff; }
  .payment_theme .payment_balance_summary_card.is-success,
  .payment_theme .finance_summary_card.is-success,
  .payment_theme .statement_summary_card.is-success { --summary-color: #0e9f6e; --summary-soft: #ecfdf5; }
  .payment_theme .payment_balance_summary_card.is-warning,
  .payment_theme .finance_summary_card.is-warning,
  .payment_theme .statement_summary_card.is-warning { --summary-color: #f59e0b; --summary-soft: #fff8e7; }
  .payment_theme .payment_balance_summary_card.is-danger,
  .payment_theme .finance_summary_card.is-danger,
  .payment_theme .statement_summary_card.is-danger { --summary-color: #dc3545; --summary-soft: #fff1f2; }
  .payment_theme .payment_balance_summary_card.is-violet,
  .payment_theme .finance_summary_card.is-violet,
  .payment_theme .statement_summary_card.is-violet { --summary-color: #7c3aed; --summary-soft: #f5f0ff; }

  .payment_theme .payment-summary-icon,
  .payment_theme .finance-summary-icon,
  .payment_theme .statement-summary-icon {
    position: relative;
    z-index: 1;
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    flex: 0 0 43px;
    border: 1px solid color-mix(in srgb, var(--summary-color) 20%, transparent);
    border-radius: 13px;
    background: color-mix(in srgb, var(--summary-color) 10%, #ffffff);
    color: var(--summary-color);
    font-size: 19px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.58);
  }

  .payment_theme .payment-summary-copy,
  .payment_theme .finance-summary-copy,
  .payment_theme .statement-summary-copy {
    position: relative;
    z-index: 1;
    min-width: 0;
  }

  .payment_theme .payment_balance_summary_card span:not(.payment-summary-icon),
  .payment_theme .finance_summary_card span:not(.finance-summary-icon),
  .payment_theme .statement_summary_card span:not(.statement-summary-icon) {
    display: block;
    margin: 0 0 5px !important;
    color: var(--payment-muted) !important;
    font-size: 10px !important;
    font-weight: 900 !important;
    letter-spacing: .055em;
    text-transform: uppercase;
  }

  .payment_theme .payment_balance_summary_card strong,
  .payment_theme .finance_summary_card strong,
  .payment_theme .statement_summary_card strong {
    display: block;
    color: var(--summary-color) !important;
    font-size: clamp(18px, 1.8vw, 24px) !important;
    font-weight: 950 !important;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .payment_theme .payment_balance_summary_card small,
  .payment_theme .finance_summary_card small,
  .payment_theme .statement_summary_card small {
    display: block;
    margin-top: 6px;
    color: var(--payment-muted) !important;
    font-size: 10px;
    font-weight: 650;
    line-height: 1.35;
  }

  .payment_theme .payment_summary_green,
  .payment_theme .finance_green,
  .payment_theme .statement_green,
  .payment_theme .payment_summary_yellow,
  .payment_theme .finance_yellow,
  .payment_theme .statement_yellow,
  .payment_theme .payment_summary_red,
  .payment_theme .finance_red,
  .payment_theme .statement_red { color: var(--summary-color) !important; }

  .payment_theme .payment_donut {
    box-shadow: 0 20px 34px rgba(33,34,39,.18), inset 8px 10px 16px rgba(255,255,255,.28), inset -8px -10px 16px rgba(33,34,39,.16) !important;
    transform: perspective(800px) rotateX(8deg);
    border: 6px solid rgba(255,255,255,.72);
  }
  .payment_theme .payment_donut::before { content:""; position:absolute; inset: 10px 14px auto 14px; height: 34%; border-radius: 999px 999px 45% 45%; background: linear-gradient(180deg, rgba(255,255,255,.56), rgba(255,255,255,0)); z-index:1; pointer-events:none; }
  .payment_theme .payment_donut::after { z-index: 2; }
  .payment_theme .payment_donut_center { z-index: 3 !important; }

  .payment_theme .payment_filter_card { padding: 18px !important; }
  .payment_theme .payment_filters { gap: 12px !important; }
  .payment_theme .payment_filter_field label { color: var(--payment-ink) !important; font-size: 12px !important; letter-spacing: .06em; }

  .payment_theme .payment_table, .payment_theme .finance_table, .payment_theme .statement_table { border-spacing: 0 10px !important; border-collapse: separate !important; }
  .payment_theme .payment_table th, .payment_theme .finance_table th, .payment_theme .statement_table th { background: transparent !important; color: var(--payment-muted) !important; border: 0 !important; padding: 0 14px 10px !important; }
  .payment_theme .payment_table td, .payment_theme .finance_table td, .payment_theme .statement_table td { background: #ffffff !important; border-top: 1px solid var(--payment-line) !important; border-bottom: 1px solid var(--payment-line) !important; padding: 15px 14px !important; }
  .payment_theme .payment_table td:first-child, .payment_theme .finance_table td:first-child, .payment_theme .statement_table td:first-child { border-left: 1px solid var(--payment-line) !important; border-radius: 18px 0 0 18px; }
  .payment_theme .payment_table td:last-child, .payment_theme .finance_table td:last-child, .payment_theme .statement_table td:last-child { border-right: 1px solid var(--payment-line) !important; border-radius: 0 18px 18px 0; }
  .payment_theme .payment_table tbody tr:hover td, .payment_theme .finance_table tbody tr:hover td, .payment_theme .statement_table tbody tr:hover td { background: #fafcff !important; }

  .payment_theme .payment_name, .payment_theme .payment_detail_title, .payment_theme .payment_value, .payment_theme .statement_client_name { color: var(--payment-ink) !important; }
  .payment_theme .payment_money_green { color: var(--payment-success) !important; }
  .payment_theme .payment_money_yellow { color: var(--payment-warning) !important; }

  .payment_theme .payment_status { border-radius: 999px !important; font-weight: 900 !important; border: 1px solid var(--payment-line) !important; }
  .payment_theme .payment_status_pending_payment { color: var(--payment-warning) !important; background: var(--payment-warning-soft) !important; border-color: rgba(171,114,36,.28) !important; }
  .payment_theme .payment_status_paid, .payment_theme .payment_status_verified, .payment_theme .payment_status_confirmed { color: var(--payment-success) !important; background: var(--payment-success-soft) !important; border-color: rgba(63,107,94,.22) !important; }
  .payment_theme .payment_status_rejected, .payment_theme .payment_status_cancelled, .payment_theme .payment_status_void { color: var(--payment-danger) !important; background: var(--payment-danger-soft) !important; border-color: rgba(197,61,61,.22) !important; }

  .payment_theme .payment_allocation_item { border-color: var(--payment-line) !important; background: #fff !important; }
  .payment_theme .payment_allocation_amount { color: var(--payment-success) !important; }
  .payment_theme .payment_allocation_credit { background: var(--payment-success-soft) !important; border-color: rgba(63,107,94,.22) !important; }

  .payment_theme .payment_actions, .payment_theme .finance_actions, .payment_theme .statement_actions { gap: 8px !important; overflow: visible; }
  .payment_theme .payment_icon_action, .payment_theme .finance_icon_action, .payment_theme .statement_icon_action {
    width: 38px !important; height: 38px !important; border-radius: 12px !important; border: 1px solid rgba(72,101,143,.14) !important;
    background: linear-gradient(180deg, rgba(189,212,231,.34) 0%, rgba(170,185,207,.16) 100%) !important;
    color: var(--payment-blue) !important; box-shadow: 0 10px 22px rgba(72,101,143,.10); position: relative; overflow: visible !important;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  }
  .payment_theme .payment_icon_action:hover, .payment_theme .finance_icon_action:hover, .payment_theme .statement_icon_action:hover { transform: translateY(-1px) !important; color: var(--payment-blue-dark) !important; box-shadow: 0 15px 28px rgba(72,101,143,.14); }
  .payment_theme .payment_icon_success { background: linear-gradient(180deg, #ebf6f1 0%, #dcefe7 100%) !important; color: var(--payment-success) !important; border-color: rgba(63,107,94,.16) !important; }
  .payment_theme .payment_icon_danger { background: linear-gradient(180deg, #e35d5d 0%, var(--payment-danger) 100%) !important; color: #fff !important; border-color: rgba(197,61,61,.3) !important; }
  .payment_theme .payment_icon_warning { background: linear-gradient(180deg, #fff8eb 0%, #fef0d6 100%) !important; color: var(--payment-warning) !important; border-color: rgba(171,114,36,.16) !important; }
  .payment_theme .payment_icon_svg, .payment_theme .finance_icon_svg, .payment_theme .statement_icon_svg { width: 16px !important; height: 16px !important; }
  .payment_theme .payment_icon_action > span, .payment_theme .finance_icon_action > span, .payment_theme .statement_icon_action > span { display: none !important; }

  .payment_theme [data-tooltip]::after { content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 9px); z-index: 80; min-width: max-content; max-width: 180px; padding: 7px 10px; border-radius: 10px; background: linear-gradient(180deg, var(--payment-blue) 0%, var(--payment-blue-dark) 100%); color: #fff; font-size: 11px; font-weight: 900; line-height: 1; white-space: nowrap; box-shadow: 0 12px 22px rgba(33,34,39,.18); opacity: 0; visibility: hidden; transform: translate(-50%, 2px); pointer-events: none; transition: opacity .04s ease, transform .04s ease, visibility .04s ease; }
  .payment_theme [data-tooltip]::before { content:""; position:absolute; left:50%; bottom:calc(100% + 3px); z-index:81; width:10px; height:10px; background:var(--payment-blue-dark); transform:translate(-50%,2px) rotate(45deg); opacity:0; visibility:hidden; pointer-events:none; transition:opacity .04s ease, transform .04s ease, visibility .04s ease; }
  .payment_theme [data-tooltip]:hover::after, .payment_theme [data-tooltip]:hover::before { opacity:1; visibility:visible; transform:translate(-50%,0); }
  .payment_theme .payment_icon_danger[data-tooltip]::after { background: linear-gradient(180deg, #e35d5d 0%, var(--payment-danger) 100%); }
  .payment_theme .payment_icon_danger[data-tooltip]::before { background: var(--payment-danger); }
  .payment_theme .payment_icon_success[data-tooltip]::after { background: linear-gradient(180deg, #4e8372 0%, var(--payment-success) 100%); }
  .payment_theme .payment_icon_success[data-tooltip]::before { background: var(--payment-success); }

  html[data-bs-theme="dark"] .payment_theme .payment_balance_summary_card,
  html[data-bs-theme="dark"] .payment_theme .finance_summary_card,
  html[data-bs-theme="dark"] .payment_theme .statement_summary_card {
    background: linear-gradient(145deg, color-mix(in srgb, var(--bs-body-bg, #121826) 95%, #ffffff), color-mix(in srgb, var(--summary-color) 10%, var(--bs-body-bg, #121826))) !important;
    border-color: color-mix(in srgb, var(--summary-color) 35%, #334155) !important;
  }
  html[data-bs-theme="dark"] .payment_theme .payment-summary-icon,
  html[data-bs-theme="dark"] .payment_theme .finance-summary-icon,
  html[data-bs-theme="dark"] .payment_theme .statement-summary-icon {
    background: color-mix(in srgb, var(--summary-color) 18%, var(--bs-body-bg, #121826));
  }

  @media (max-width: 992px) { .payment_theme .payment_overview { grid-template-columns: 1fr !important; } .payment_theme .payment_filters { grid-template-columns: 1fr 1fr !important; } .payment_theme .payment_balance_summary_grid, .payment_theme .finance_summary_grid, .payment_theme .statement_summary_grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
  @media (max-width: 700px) { .payment_theme .payment_filters, .payment_theme .payment_balance_summary_grid, .payment_theme .finance_summary_grid, .payment_theme .statement_summary_grid { grid-template-columns: 1fr !important; } .payment_theme .crm_button { width: 100%; } }
</style>
