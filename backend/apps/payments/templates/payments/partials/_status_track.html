<div class="nj-workflow finance-locked-workflow{% if detail %} is-detail{% endif %}{% if compact %} is-compact{% endif %}" aria-label="Payment status: {{ payment.get_status_display }}">
  <span class="finance-workflow-lock"><i class="bi bi-lock" aria-hidden="true"></i> Accounting controlled</span>
  <div class="nj-status-track finance-status-track">
    <span class="nj-status-node is-warning{% if payment.status == 'pending_payment' %} is-current{% endif %}" style="--stage-color:#f59e0b" title="Pending payment" aria-label="Pending payment"><i class="bi bi-clock-history" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-blue{% if payment.status == 'paid' %} is-current{% endif %}" style="--stage-color:#0868e8" title="Paid" aria-label="Paid"><i class="bi bi-cash-stack" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-violet{% if payment.status == 'verified' %} is-current{% endif %}" style="--stage-color:#7c3aed" title="Verified" aria-label="Verified"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-success{% if payment.status == 'confirmed' %} is-current{% endif %}" style="--stage-color:#0e9f6e" title="Confirmed" aria-label="Confirmed"><i class="bi bi-check2-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-danger{% if payment.status == 'rejected' or payment.status == 'cancelled' %} is-current{% endif %}" style="--stage-color:#ef3340" title="Rejected / cancelled" aria-label="Rejected or cancelled"><i class="bi bi-x-circle" aria-hidden="true"></i></span>
    <span class="nj-status-line" aria-hidden="true"></span>
    <span class="nj-status-node is-void{% if payment.status == 'void' %} is-current{% endif %}" style="--stage-color:#6b7280" title="Void" aria-label="Void"><i class="bi bi-slash-circle" aria-hidden="true"></i></span>
  </div>
  <span class="nj-status-caption {% if payment.status == 'pending_payment' %}is-warning{% elif payment.status == 'paid' %}is-blue{% elif payment.status == 'verified' %}is-violet{% elif payment.status == 'confirmed' %}is-success{% elif payment.status == 'void' %}is-void{% else %}is-danger{% endif %}">{{ payment.get_status_display }}</span>
</div>
