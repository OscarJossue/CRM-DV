{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#071B78">
  <title>{% trans "Password updated" %} | NexxtJob CRM</title>
  <link rel="icon" href="{% static 'branding/nexxtjob-symbol.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/nexxtjob-auth.css' %}">
</head>
<body class="nj-auth-body">
  <main class="nj-reset-shell">
    <div class="nj-reset-brand">
      <img src="{% static 'branding/nexxtjob-logo.svg' %}" alt="NexxtJob CRM">
    </div>

    <div class="nj-reset-icon"><i class="bi bi-check2-circle"></i></div>
    <h1 class="nj-reset-title">{% trans "Password updated" %}</h1>
    <p class="nj-reset-text">
      {% trans "Your password was changed successfully. You can now sign in to NexxtJob with your new password." %}
    </p>

    <div class="nj-reset-actions">
      <a class="nj-primary-button" href="{% url 'accounts:login' %}">
        <span>{% trans "Go to sign in" %}</span>
        <i class="bi bi-arrow-right"></i>
      </a>
    </div>

    <div class="nj-reset-maker">
      <img src="{% static 'branding/devlayer-studio.png' %}" alt="DevLayer Studio">
    </div>
  </main>
</body>
</html>
