<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>

  .account_icon_action {

  .account_icon_action svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .account_icon_action[data-tooltip]::after {
    content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 9px); z-index: 80; min-width: max-content; max-width: 190px;

  .account_icon_action[data-tooltip]:hover::after,

  .account_icon_danger[data-tooltip]::before { background: var(--account-danger); }
  .account_icon_success[data-tooltip]::after { background: linear-gradient(180deg, #4e8372 0%, var(--account-success) 100%); }

  .account_info_item_full { grid-column: 1 / -1; align-content: start; }

  .account_detail_value { color: var(--account-ink); font-size: 15px; font-weight: 800; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }

  .account_help { color: var(--account-muted); font-size: 12px; font-weight: 650; line-height: 1.45; margin: 0; }
  .account_actions_bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .permission_grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .permission_card { border: 1px solid var(--account-line); border-radius: 18px; background: #ffffff; padding: 14px; display: grid; gap: 12px; }
  .permission_module_name { color: var(--account-ink); font-size: 15px; font-weight: 900; line-height: 1.3; }
  .permission_module_key { color: var(--account-muted); font-size: 11px; font-weight: 800; }
  .permission_actions_grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .permission_check_box { display: grid; gap: 4px; padding: 10px; border-radius: 14px; background: var(--account-panel-soft); border: 1px solid var(--account-line); }
  .permission_check_label { color: var(--account-muted); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
  .permission_yes { color: var(--account-success); font-size: 13px; font-weight: 900; }

  .permission_matrix_wrap { width: 100%; overflow-x: auto; border-radius: 20px; border: 1px solid var(--account-line); }
  .permission_matrix { width: 100%; min-width: 760px; border-collapse: collapse; }
  .permission_matrix th, .permission_matrix td { padding: 13px 14px; border-bottom: 1px solid var(--account-line); vertical-align: middle; }
  .permission_matrix th { color: var(--account-muted); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; background: var(--account-panel-soft); }
  .permission_matrix tr:last-child td { border-bottom: 0; }
  .permission_matrix tbody tr:hover td { background: #fafcff; }
  .permission_cell_center { text-align: center; }
  .permission_switch { position: relative; display: inline-flex; width: 48px; height: 28px; }
  .permission_switch input { position: absolute; opacity: 0; pointer-events: none; }
  .permission_slider { position: absolute; inset: 0; border-radius: 999px; background: #e5eaf2; border: 1px solid var(--account-line-strong); transition: .12s ease; cursor: pointer; }
  .permission_slider::before { content: ""; position: absolute; width: 22px; height: 22px; left: 2px; top: 2px; border-radius: 999px; background: #ffffff; box-shadow: 0 3px 10px rgba(33,34,39,.16); transition: .12s ease; }
  .permission_switch input:checked + .permission_slider { background: linear-gradient(180deg, var(--account-blue) 0%, var(--account-blue-dark) 100%); border-color: var(--account-blue); }
  .permission_switch input:checked + .permission_slider::before { transform: translateX(20px); }
  .permission_switch.success input:checked + .permission_slider { background: linear-gradient(180deg, #4e8372 0%, var(--account-success) 100%); border-color: var(--account-success); }
  .permission_switch.warning input:checked + .permission_slider { background: linear-gradient(180deg, #c2872d 0%, var(--account-warning) 100%); border-color: var(--account-warning); }

  .permission_small_button:hover,

  .account_confirm_overlay.is_open { display: flex; }
  .account_confirm_dialog { width: min(100%, 460px); border-radius: 24px; border: 1px solid var(--account-line); background: #ffffff; box-shadow: 0 30px 90px rgba(33,34,39,.24); padding: 22px; display: grid; gap: 14px; }
  .account_confirm_icon { width: 50px; height: 50px; border-radius: 18px; display: grid; place-items: center; background: var(--account-danger-soft); color: var(--account-danger); }
  .account_confirm_icon.success { background: var(--account-success-soft); color: var(--account-success); }

  @media (max-width: 1100px) {

</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    let pendingForm = null;
    const forms = Array.from(document.querySelectorAll("[data-account-confirm]"));
    if (!forms.length) { return; }

    const overlay = document.createElement("div");
    overlay.className = "account_theme account_confirm_overlay";
    overlay.innerHTML = `
      <div class="account_confirm_dialog" role="dialog" aria-modal="true" aria-labelledby="accountConfirmTitle">
        <div id="accountConfirmIcon" class="account_confirm_icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        </div>
        <div>
          <h3 id="accountConfirmTitle" class="account_confirm_title">Confirm action</h3>
          <p id="accountConfirmText" class="account_confirm_text">Are you sure you want to continue?</p>
        </div>
        <div class="account_confirm_actions">
          <button type="button" class="account_button account_button_secondary crm-uia crm-uia--void" data-account-confirm-cancel>Cancel</button>
          <button type="button" class="account_button account_button_danger crm-uia crm-uia--approve" data-account-confirm-ok>Confirm</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const title = overlay.querySelector("#accountConfirmTitle");
    const text = overlay.querySelector("#accountConfirmText");
    const icon = overlay.querySelector("#accountConfirmIcon");
    const okButton = overlay.querySelector("[data-account-confirm-ok]");
    const cancelButton = overlay.querySelector("[data-account-confirm-cancel]");

    function closeModal() {
      overlay.classList.remove("is_open");
      pendingForm = null;
    }

    function openModal(form) {
      pendingForm = form;
      const kind = form.getAttribute("data-account-confirm-kind") || "danger";
      title.textContent = form.getAttribute("data-account-confirm-title") || "Confirm action";
      text.textContent = form.getAttribute("data-account-confirm-message") || "Are you sure you want to continue?";
      okButton.textContent = form.getAttribute("data-account-confirm-button") || "Confirm";
      okButton.classList.toggle("account_button_danger", kind !== "success");
      okButton.classList.toggle("account_button_success", kind === "success");
      icon.classList.toggle("success", kind === "success");
      overlay.classList.add("is_open");
    }

    forms.forEach(function (form) {
      form.addEventListener("submit", function (event) {
        if (form.dataset.accountConfirmed === "1") {
          return;
        }
        event.preventDefault();
        openModal(form);
      });
    });

    okButton.addEventListener("click", function () {
      if (!pendingForm) { return; }
      pendingForm.dataset.accountConfirmed = "1";
      pendingForm.submit();
    });

    cancelButton.addEventListener("click", closeModal);
    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) { closeModal(); }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") { closeModal(); }
    });
  });
</script>
